name: Guard evaluation quality

on:
  # schedule:  # Paused: auto-refresh disabled to avoid unnecessary token consumption.
  #   # Monday 08:47 Asia/Shanghai.
  #   - cron: "47 0 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: agent-pulse-quality-guard-main
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: sqlite:./var/quality-guard.db
      QUALITY_FLOOR: 60
      REFRESH_COOLDOWN_HOURS: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore auditable repository snapshot
        run: npm run db:snapshot -- restore

      - name: Evaluate current system quality
        id: evaluation
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent evaluate:system -- \
            --skip-bootstrap \
            --gate=operational \
            --baseline=data/reports/system-evaluation.json \
            --output="$RUNNER_TEMP/evaluation.json" \
            --summary="$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/evaluation-output.json"
          jq -e '.operationalDecision.status and .operationalDecision.fingerprint' "$RUNNER_TEMP/evaluation.json" >/dev/null
          score="$(jq -r '.overallScore' "$RUNNER_TEMP/evaluation.json")"
          test "$score" -ge 0
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.operationalDecision.status' "$RUNNER_TEMP/evaluation.json")" >> "$GITHUB_OUTPUT"
          echo "reason_codes=$(jq -c '.operationalDecision.reasonCodes' "$RUNNER_TEMP/evaluation.json")" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -r '.operationalDecision.fingerprint' "$RUNNER_TEMP/evaluation.json")" >> "$GITHUB_OUTPUT"
          echo "refresh_eligible=$(jq -r '.operationalDecision.refreshEligible' "$RUNNER_TEMP/evaluation.json")" >> "$GITHUB_OUTPUT"
          jq '{overallScore, rawWeightedScore, evidenceCoverage, evaluationAsOf, operationalDecision}' "$RUNNER_TEMP/evaluation.json"

      - name: Record guard summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality Guard"
            echo "- Score: ${{ steps.evaluation.outputs.score || 'unavailable' }} / 100"
            echo "- Floor: $QUALITY_FLOOR"
            echo "- Status: ${{ steps.evaluation.outputs.status || 'unknown' }}"
            echo '- Reasons: `${{ steps.evaluation.outputs.reason_codes || '[]' }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-guard-${{ github.run_id }}
          path: ${{ runner.temp }}/evaluation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Update the single monitor incident
        if: steps.evaluation.outputs.status == 'critical'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/evaluation.json"
          body="$RUNNER_TEMP/monitor-issue.md"
          {
            echo "<!-- agent-pulse-monitor:v3 fingerprint=$(jq -r '.operationalDecision.fingerprint' "$report") -->"
            echo '# Agent Pulse 运营评测告警'
            echo
            echo "- 当前评测时间：$(jq -r '.evaluationAsOf' "$report")"
            echo "- 已持久化水位：$(jq -r '.operationalDecision.persistedEvaluationAsOf // "missing"' "$report")"
            echo "- 水位年龄（分钟）：$(jq -r '.operationalDecision.ageMinutes // "unknown"' "$report")"
            echo "- 当前分数：$(jq -r '.operationalDecision.currentScore // "unknown"' "$report") / 100"
            echo "- 原因：$(jq -r '.operationalDecision.reasonCodes | join(", ")' "$report")"
            echo
            echo '## 建议动作'
            echo '- 检查本次证据；满足冷却期与并发门禁时，仅触发一次 incremental Data Refresh。'
            echo
            echo "[查看本次 Actions 运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$body"
          gh label create "monitor:critical" --color d73a4a --description "Operational health incident" --force
          issue="$(gh issue list --state open --label 'monitor:critical' --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "[Monitor] Agent Pulse critical health incident" --label "monitor:critical" --body-file "$body"
          fi

      - name: Check refresh cooldown and active runs
        if: steps.evaluation.outputs.status == 'critical'
        id: cooldown
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_ELIGIBLE: ${{ steps.evaluation.outputs.refresh_eligible }}
        shell: bash
        run: |
          set -euo pipefail
          queued="$(gh run list --workflow data-refresh.yml --status queued --limit 1 --json databaseId,status --jq 'if length > 0 then {id: .[0].databaseId, status: .[0].status} else {} end')"
          in_progress="$(gh run list --workflow data-refresh.yml --status in_progress --limit 1 --json databaseId,status --jq 'if length > 0 then {id: .[0].databaseId, status: .[0].status} else {} end')"
          latest="$(gh run list --workflow data-refresh.yml --status completed --limit 1 --json createdAt,status,conclusion --jq '.[0] // {}')"
          QUEUED_REFRESH="$queued" IN_PROGRESS_REFRESH="$in_progress" LATEST_REFRESH="$latest" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const queued = JSON.parse(process.env.QUEUED_REFRESH || "{}");
          const inProgress = JSON.parse(process.env.IN_PROGRESS_REFRESH || "{}");
          const latest = JSON.parse(process.env.LATEST_REFRESH || "{}");
          const refreshEligible = process.env.REFRESH_ELIGIBLE === "true";
          const active = Boolean(queued.id || inProgress.id);
          const ageMs = Date.now() - Date.parse(latest.createdAt || "");
          const cooldownMs = Number(process.env.REFRESH_COOLDOWN_HOURS || 2) * 60 * 60 * 1000;
          const stale = !Number.isFinite(ageMs) || ageMs >= cooldownMs;
          const failed = latest.status === "completed" && latest.conclusion !== "success";
          if (!refreshEligible || active) {
            process.stdout.write("dispatch=false\n");
          } else {
            process.stdout.write(`dispatch=${stale || failed}\n`);
          }
          process.stdout.write(`active=${active}\n`);
          process.stdout.write(`latest_status=${latest.status || "missing"}\n`);
          NODE

      - name: Trigger one bounded system update
        if: steps.evaluation.outputs.status == 'critical' && steps.cooldown.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data-refresh.yml --ref main --field mode=incremental

      - name: Fail the operational gate
        if: always() && steps.evaluation.outputs.status == 'critical'
        run: exit 1
